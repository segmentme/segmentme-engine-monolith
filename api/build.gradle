repositories {
    maven { url 'https://jitpack.io' }
    maven { url 'https://oss.jfrog.org/artifactory/libs-snapshot' }
    maven { url 'https://oss.jfrog.org/artifactory/oss-snapshot-local' }
    maven { url 'https://repo.spring.io/milestone' }
    maven { url 'https://repo.spring.io/snapshot' }
}

dependencies {
    compile project(':service')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'


    implementation 'org.springframework.boot:spring-boot-starter-rsocket'
//    implementation 'com.netflix.concurrency-limits:concurrency-limits-core:0.3.6'
    implementation 'org.springframework.cloud:spring-cloud-starter-consul-discovery'
//    compile group: 'io.rsocket', name: 'rsocket-load-balancer', version: '1.1.0'
//    compile group: 'io.rsocket', name: 'rsocket-core', version: '1.1.0'

    compile group: 'io.rsocket.routing', name: 'rsocket-routing-client-spring', version: '0.2.0'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.security:spring-security-oauth2-resource-server'
    implementation 'org.springframework.security:spring-security-oauth2-jose'
    implementation 'org.springframework.security:spring-security-config'
    compile group: 'org.springframework.security.oauth', name: 'spring-security-oauth2', version: '2.5.0.RELEASE'
    compile group: 'org.springframework.security', name: 'spring-security-oauth2-client', version: '5.4.2'
    compile 'org.springframework.boot:spring-boot-starter-webflux'
    testCompile project(path: ':service', configuration: 'tests')
    testImplementation 'org.springframework.security:spring-security-test'
    implementation 'com.netflix.concurrency-limits:concurrency-limits-core:0.3.6'


}
