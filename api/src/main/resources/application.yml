logging:
    level:
        root: ERROR
        io.segmentme.core.api.facade: INFO
auth0:
    audience: https://segmentme.us.auth0.com/api/v2/
    managementApi: https://segmentme.us.auth0.com/api/v2/
spring:
    data:
        mongodb:
            auto-index-creation: on
    security:
        oauth2:
            client:
                registration:
                    auth0:
                        client-id: FRFEhM5zwQCva2tSfBxDuM3og5TdjUpC
                        client-secret: Rsic0pW4Wr_q91Ppin-UNRuq5EdH5X7EmhA4ZUTcN-6MBu_Wy8Ce1J89WPCpkD_4
                        authorization-grant-type: client_credentials
                        clientAuthenticationMethod: post
                provider:
                    auth0:
                        token-uri: https://segmentme.us.auth0.com/oauth/token
            resourceserver:
                jwt:
                    issuer-uri: https://segmentme.us.auth0.com/
segmentme:
    application:
        analysis:
            pool:
                corePoolSize: ${ANALYSIS_CORE_POOL_SIZE:10}
                maxPoolSize: ${ANALYSIS_MAX_POOL_SIZE:10}
                queueSize: ${ANALYSIS_QUEUE_POOL_SIZE:50}
                threadNamePrefix: ${ANALYSIS_THREAD_NAME_PREFIX:'analysis-executor-'}
        redis:
            host: ${REDIS_HOST:localhost}
            port: ${REDIS_PORT:6379}
            connectionTimeout: ${REDIS_CONNECTION_TIMEOUT:25}
            readTimeOut: ${REDIS_READ_TIMEOUT:15}
            stream:
                eventKey: analysis-request-event
                groupName: analysis-request-event-group
                streamPollTimeout: 1000 #milliseconds
