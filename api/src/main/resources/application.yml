logging:
    level:
        root: INFO
        io.rsocket.FrameLogger: DEBUG

auth0:
    audience: https://segmentme.us.auth0.com/api/v2/
    managementApi: https://segmentme.us.auth0.com/api/v2/
spring:
    application:
        order: 2
        name: analysis-service
    cloud:
        consul:
            discovery:
                instance-group: analysis-service
                service-name: analysis-service
    data:
        mongodb:
            auto-index-creation: on
    security:
        oauth2:
            client:
                registration:
                    auth0:
                        client-id: FRFEhM5zwQCva2tSfBxDuM3og5TdjUpC
                        client-secret: Rsic0pW4Wr_q91Ppin-UNRuq5EdH5X7EmhA4ZUTcN-6MBu_Wy8Ce1J89WPCpkD_4
                        authorization-grant-type: client_credentials
                        clientAuthenticationMethod: post
                provider:
                    auth0:
                        token-uri: https://segmentme.us.auth0.com/oauth/token
            resourceserver:
                jwt:
                    issuer-uri: https://segmentme.us.auth0.com/
segmentme:
    application:
        redis:
            host: ${REDIS_HOST:localhost}
            port: ${REDIS_PORT:6379}
            connectionTimeout: ${REDIS_CONNECTION_TIMEOUT:25}
            readTimeOut: ${REDIS_READ_TIMEOUT:15}
io:
    rsocket:
        routing:
            client:
#                route-id: 00000000-0000-0000-0000-000000000011
                service-name: analysis-service
                tags:
                    INSTANCE_NAME: analysis-service-1
                brokers:
                    - tcp:
                          host: localhost
                          port: 8002