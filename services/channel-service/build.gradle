repositories {
    maven { url 'https://jitpack.io' }
    maven { url 'https://oss.jfrog.org/artifactory/libs-snapshot' }
    maven { url 'https://oss.jfrog.org/artifactory/oss-snapshot-local' }
    maven { url 'https://repo.spring.io/milestone' }
    maven { url 'https://repo.spring.io/snapshot' }
}
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    compile group: 'redis.clients', name: 'jedis', version: '3.4.1'
    compile project(':dependencies:redis-dependency')

    implementation 'org.springframework.boot:spring-boot-starter-rsocket'
//    implementation 'com.netflix.concurrency-limits:concurrency-limits-core:0.3.6'
    implementation 'org.springframework.cloud:spring-cloud-starter-consul-discovery'
//    compile group: 'io.rsocket', name: 'rsocket-load-balancer', version: '1.1.0'
//    compile group: 'io.rsocket', name: 'rsocket-core', version: '1.1.0'
//    compile group: 'io.rsocket.routing', name: 'rsocket-routing-client-spring', version: '0.2.0'

    implementation 'com.netflix.concurrency-limits:concurrency-limits-core:0.3.6'
  // compile group: 'io.rsocket.routing', name: 'rsocket-routing-client-spring', version: '0.2.0'

    compile fileTree(dir: 'D:\\Projects\\production-projects\\segmentme\\segmentme-engine-monolith\\libs', include: ['*.jar'])

}


task jarTests(type: Jar, dependsOn: testClasses) {
    archiveClassifier = 'tests'
    from sourceSets.test.output
}

configurations {
    tests {
        extendsFrom testRuntime
    }
}
artifacts {
    tests jarTests
}

