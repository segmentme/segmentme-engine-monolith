repositories {
    maven { url 'https://jitpack.io' }
    maven { url 'https://oss.jfrog.org/artifactory/libs-snapshot' }
    maven { url 'https://oss.jfrog.org/artifactory/oss-snapshot-local' }
    maven { url 'https://repo.spring.io/milestone' }
    maven { url 'https://repo.spring.io/snapshot' }
}
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
//    implementation 'org.springframework.boot:spring-boot-starter-web'
//    implementation 'org.springframework.boot:spring-boot-starter-validation'
// https://mvnrepository.com/artifact/org.springframework/spring-messaging
    implementation 'org.springframework:spring-messaging'
    implementation("org.springframework.cloud:spring-cloud-starter-bootstrap")
//    implementation 'org.springframework.boot:spring-boot-starter-rsocket'
    implementation 'com.netflix.concurrency-limits:concurrency-limits-core:0.3.6'
    implementation 'org.springframework.cloud:spring-cloud-starter-consul-discovery'
    compile group: 'io.rsocket', name: 'rsocket-load-balancer', version: '1.1.0'
    compile group: 'io.rsocket', name: 'rsocket-core', version: '1.1.0'
    compile "org.agrona:agrona:1.9.0"
    compile "org.roaringbitmap:RoaringBitmap:0.9.3"
    compile group: 'io.rsocket.routing', name: 'rsocket-routing-common-spring', version: '0.2.0'

    compile fileTree(dir: 'd:\\Projects\\production-projects\\segmentme\\segmentme-engine-monolith\\services\\broker-service\\libs\\', include: ['*.jar'])
    compile fileTree(dir: 'd:\\Projects\\production-projects\\segmentme\\segmentme-engine-monolith\\services\\broker-service\\libs\\', include: ['*.jar'])

    compile fileTree(dir: 'D:\\Projects\\production-projects\\segmentme\\segmentme-engine-monolith\\libs', include: ['*.jar'])

}


task jarTests(type: Jar, dependsOn: testClasses) {
    archiveClassifier = 'tests'
    from sourceSets.test.output
}

configurations {
    tests {
        extendsFrom testRuntime
    }
}
artifacts {
    tests jarTests
}

