import groovy.model.ValueHolder

plugins {
    id 'org.springframework.boot' version '2.3.3.RELEASE'
    id 'com.bmuschko.docker-remote-api' version '6.6.1'
}
import com.bmuschko.gradle.docker.tasks.image.*

def projectSettings = new ValueHolder()
apply from: 'modules.gradle', to: projectSettings


subprojects {
    ext {
        rootProjectInfo = projectSettings.value
        moduleSettings = rootProjectInfo.settings.find { it.name.tokenize(':').last() == name }
    }
    if (moduleSettings != null) {
        group = 'io.segmentme'
        version = moduleSettings.version

        if (moduleSettings.isJava) {
            javaProjectConfiguration(it)

            test {
                useJUnitPlatform()
            }
        }

        if (moduleSettings.isBoot) {
            bootProjectConfiguration(it)
        }
    }
}

def bootProjectConfiguration(Project project) {

    configure(project) {
        apply plugin: 'org.springframework.boot'
        apply plugin: "com.bmuschko.docker-remote-api"

        sourceCompatibility = 14.0

        task copyJar(type: Copy) {
            dependsOn build
            from "build/libs/${project.name}-${project.version}.jar"
            into 'build/docker'
            rename { String fileName ->
                fileName.replace("-${project.version}", "")
            }
        }


        task createDockerfile(type: Dockerfile) {
            dependsOn copyJar
            from('adoptopenjdk/openjdk14:latest')
            label(['maintainer': 'SegmentMe Team'])
            copyFile("/${project.name}.jar", '/app/app.jar')
            entryPoint('sh', '-c', 'java \$JAVA_OPTS \$EXTRA_PROPS -Dspring.profiles.active=cloud -jar \'/app/app.jar\'')
            exposePort(80)
        }

        task buildDocker(type: DockerBuildImage) {
            dependsOn createDockerfile
            images.add("${System.properties.get("DOCKER_REGISTRY", 'localhost:5000')}/${project.group}/${project.name}")
        }


        docker {
            if (System.env.DOCKER_HOST) {
                url = System.env.DOCKER_HOST.replace("tcp", "https")
                if (System.env.DOCKER_CERT_PATH) {
                    certPath = new File(System.env.DOCKER_CERT_PATH)
                }
            }
//    url = 'tcp://127.0.0.1'
        }
    }

}

def javaProjectConfiguration(Project project) {
    configure(project) {
        apply plugin: 'java-library'
        apply plugin: 'groovy'
        apply plugin: 'io.spring.dependency-management'

        group = 'io.segmentme'
        version = '0.0.1-SNAPSHOT'
        sourceCompatibility = JavaVersion.VERSION_14
        targetCompatibility = JavaVersion.VERSION_14

        configureDependencyManagement(project)
    }
}


def configureDependencyManagement(Project project) {
    configure(project) {

        repositories {
            mavenCentral()
            jcenter()
        }

        wrapper.gradleVersion = '6.6.1'

        dependencies {
            compileOnly 'org.projectlombok:lombok'
            compile 'commons-beanutils:commons-beanutils'

            annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"
            annotationProcessor 'org.projectlombok:lombok'

            testImplementation('org.springframework.boot:spring-boot-starter-test') {
                exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
            }

            testImplementation "org.spockframework:spock-core"
            testImplementation "org.spockframework:spock-spring"
            testImplementation "cglib:cglib-nodep"
            testImplementation 'org.codehaus.groovy:groovy'
            testCompileOnly 'org.projectlombok:lombok'
            testAnnotationProcessor 'org.projectlombok:lombok'
        }

        dependencyManagement {
            imports {
                mavenBom "org.springframework.boot:spring-boot-dependencies:${rootProjectInfo.springVersion}"
            }

            dependencies {
                dependency 'org.projectlombok:lombok:1.18.12'
                dependency 'org.spockframework:spock-core:2.0-M3-groovy-3.0'
                dependency 'org.spockframework:spock-spring:2.0-M3-groovy-3.0'
                dependency 'cglib:cglib-nodep:3.3.0'
                dependency 'org.codehaus.groovy:groovy:3.0.5'
                dependency 'commons-beanutils:commons-beanutils:1.9.4'
                dependency 'org.apache.commons:commons-lang3:3.11'
            }
        }
    }
}
